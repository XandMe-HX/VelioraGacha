name: Maven Build

on:
  push:
    branches:
      - main
      - clean
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: VelioraGacha
          path: target/VelioraGacha-*.jar
          if-no-files-found: error
